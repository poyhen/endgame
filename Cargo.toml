[package]
name = "endgame"
version = "0.1.0"
edition = "2024"

[dependencies]
grammers-client = { git = "https://codeberg.org/Lonami/grammers.git", rev = "1e31e73cd9797790905bbea82cd75adcbe6f1242" }
grammers-session = { git = "https://codeberg.org/Lonami/grammers.git", rev = "1e31e73cd9797790905bbea82cd75adcbe6f1242", features = ["sqlite-storage"] }
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
log = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.10"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime = "0.3"
mime_guess = "2"
anyhow = "1"
url = "2"
